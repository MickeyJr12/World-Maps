    <style>

      
      * {
        /* outline : 1px solid red; */
        -webkit-user-select: none; /* Safari / Chrome mobile */
        -webkit-touch-callout: none; /* empêche le menu contextuel sur iOS (hold) */
        user-select: none;
        -webkit-tap-highlight-color: transparent; /* retire le flash gris iOS */
        touch-action: manipulation; /* désactive le double-tap zoom → réduit le délai de 300ms */
      }

      :root {
        --font-main: "Outfit", sans-serif;
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-title);
      }

      html {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        perspective: 1000px;
        display: flex;
        font-family: var(--font-main);
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          327deg,
          #0f23fa 0%,
          #0f85fa 63%,
          #0fe7fa 100%
        );
        background-repeat: no-repeat;
      }


       #cadreNvll{
        display : flex;
        position: absolute;
        text-align: center;
        left : 50%;
        top : 50%;
        transform: translateX(-50%) translateY(-50%);
        flex-direction : column;
        align-items: center;
        color : white;
        gap : 0.8rem;
        padding : 0.6rem;
        box-sizing: border-box;
        outline : 1px solid rgba(255,255,255,0.4);
        box-shadow: 0 2px 5px rgba(20, 40, 100, 0.06);
        width : calc(100% - 3rem);
        max-width: 600px;
        border-radius: 1rem;
        background:  rgba(255,255,255,0.2);
        backdrop-filter: blur(10px);
        contain: layout paint;
        isolation: isolate; 
      }
      .iconAppEphe{
        height : 4rem;
        aspect-ratio: 1/1;
        border-radius: inherit ;
        box-shadow: 0 2px 5px rgba(20, 40, 100, 0.1);

      }

      #wrapperQRCode{
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        background-color: rgba(255,255,255,0.75);
        border-radius: inherit;
        width: 6rem;
        height : 6rem;

      }
      .qrCode{
        display : flex;
        width: 100;
        height: 100%;
      }
      .btnEphe{
        display: flex;
        position: relative;
        align-items: center;
        justify-content: center;
        text-align: center;
        width : 100%;
        gap : 0.6rem;
        border-radius: 0.8rem;
        padding: 0.6rem 1rem;
        box-sizing: border-box;
        background: rgb(9, 28, 238);
        transition: transform 0.2s ease;
      }

      .btnEphe:active{
        transform: scale(0.96);
      }

      .iconApple{
        transform: translateY(-0.1rem);
        height: 1.2rem;;
        left : 0.5rem;
        /* fill : rgb(234, 130, 10); */
      }

      #btnShareEphe{
        background : rgb(208, 111, 0)
      }

       #iconApp {
        display: flex;
        flex-shrink: 0;
        align-self: center;
        width: 4rem;
        aspect-ratio: 1/1;
      }

 
    </style>

  <script>

     document.documentElement.style.height = window.screen.height + "px";
      document.body.style.height = window.screen.height + "px";


   //  Script bulles
window.addEventListener("load", () => {
      // Force un repaint du calque backdrop-filter à chaque frame
      const cadreNvll = document.getElementById('cadreNvll');
function nudgeBackdrop() {
  // Micro-changement imperceptible qui force WebKit à re-composer
  cadreNvll.style.transform = `translateZ(0) translateY(-50%) translateX(-50%) scale(${1 + Math.random() * 0.0001})`;
  requestAnimationFrame(nudgeBackdrop);
}
requestAnimationFrame(nudgeBackdrop);

    let cordH_m = new Map();
    let vecteursH_m = new Map();
    let checkH_m = new Map(); /* On modifie deux hearts dans chaque boucle du for, pour ne pas le check deux fois */

    let heightB = 65 // taille des bulles
    let R = heightB; // Rayon de collision
    let nbrBulles = 15// nombre de bulles créées

    function norme(x1, y1, x2, y2) {
      return ((x1 - x2) ** 2 + (y1 - y2) ** 2) ** 0.5;
    }

    function moveH(h) {
      if (!vecteursH_m.has(h)) return;

      const rect = h.getBoundingClientRect(); // ← une seule fois
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      // Mise à jour des coordonnées de h
      cordH_m.set(h, { x: cx, y: cy });

      let vx = vecteursH_m.get(h).vx;
      let vy = vecteursH_m.get(h).vy;

      for (const H2 of cordH_m.keys()) {
        if (H2 === h) continue;

        const cx2 = cordH_m.get(H2).x;
        const cy2 = cordH_m.get(H2).y;
        const dist = norme(cx, cy, cx2, cy2);

        if (dist < R && dist > 0) {
          // ✅ Séparation des cœurs pour éviter le chevauchement
          const overlap = R - dist;
          const nx = (cx2 - cx) / dist;
          const ny = (cy2 - cy) / dist;

          // On repousse h dans la direction opposée à H2
          h.style.left = parseFloat(h.style.left) - (nx * overlap) / 2 + "px";
          h.style.top = parseFloat(h.style.top) - (ny * overlap) / 2 + "px";

          const Vx2 = vecteursH_m.get(H2).vx;
          const Vy2 = vecteursH_m.get(H2).vy;

          const Vref = { x: vx - Vx2, y: vy - Vy2 };
          const p = Vref.x * nx + Vref.y * ny;

          // ✅ On ne rebondit que si les cœurs se rapprochent (p > 0)
          if (p > 0) {
            vx = vx - p * nx;
            vy = vy - p * ny;
            vecteursH_m.set(H2, { vx: Vx2 + p * nx, vy: Vy2 + p * ny });
          }
        }
      }

      vecteursH_m.set(h, { vx, vy });

      // Rebonds sur les murs
      if (cx + rect.width / 2 > window.innerWidth || cx - rect.width / 2 < 0) {
        vecteursH_m.set(h, {
          vx: -vecteursH_m.get(h).vx,
          vy: vecteursH_m.get(h).vy,
        });
      }
      if (
        cy + rect.height / 2 > window.innerHeight + 15 ||
        cy - rect.height / 2 < 0
      ) {
        vecteursH_m.set(h, {
          vx: vecteursH_m.get(h).vx,
          vy: -vecteursH_m.get(h).vy,
        });
      }

      h.style.left = parseFloat(h.style.left) + vecteursH_m.get(h).vx + "px";
      h.style.top = parseFloat(h.style.top) + vecteursH_m.get(h).vy + "px";

      requestAnimationFrame(() => moveH(h));
    }

    let VX = [];
    let VY = [];

    for (let i = 0; i < nbrBulles; i++) {
      VX.push(-2 + Math.random() * 4);
      VY.push(-2 + Math.random() * 4);
    }

    for (let i = 0; i <  nbrBulles; i++) {
      const el = document.createElement("div");
      el.innerHTML = `<svg  height="${heightB}" viewBox="0 0 7032 7026" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect x="16" y="26" width="7000" height="7000" rx="3500" fill="#122B49"/>

<path d="M1926.18 1670.86C1854.8 1738.24 1842.06 1854.03 1872.84 1932.1C1907.18 2019.19 2000.36 2117.45 2168.85 2209.15C2335.07 2299.62 2557.19 2374.04 2817.27 2423.28C3076.75 2472.4 3362.45 2494.25 3648.59 2486.5C3934.8 2478.76 4210.65 2441.69 4451.45 2379.33C4693.19 2316.72 4887.07 2231.86 5019.77 2136.14C5153.75 2039.5 5209.02 1931.7 5214.18 1867.25C5219.33 1802.8 5214.18 1726.71 5103.69 1632.86C4695.81 1286.41 4186.04 1084.22 3652.7 1057.93C3119.37 1031.65 2592.25 1182.57 2152.73 1487.42C1713.21 1792.26 1385.73 2234.06 1220.84 2744.63C1055.95 3255.19 1062.82 3806.12 1240.39 4312.37C1417.96 4818.62 1756.35 5252.04 2203.33 5545.71C2650.32 5839.38 3181.03 5976.98 3713.54 5937.26C4246.05 5897.54 4750.75 5682.72 5149.73 5325.95C5548.71 4969.19 5819.78 4490.31 5921.09 3963.27C5962.49 3747.88 5890.96 3497.86 5681.55 3497.86H3971.83C3688.13 3497.86 3688.13 4027.13 3971.83 4027.13H4552.14C4608.85 4028.39 4703.41 4062.3 4708.8 4166.21M5071.09 5393.32C5186.43 5294.81 5220.87 5204.06 5214 5126.75C5206.87 5046.43 5150.2 4949.9 5012.78 4851.76C4876.67 4754.56 4678.67 4668.92 4432.82 4606.41C4187.91 4544.14 3908.16 4508.04 3619.05 4502.07C3330 4496.11 3042.68 4520.51 2783.39 4572.62C2523.45 4624.85 2303.72 4702.52 2141.91 4795.81C1977.9 4890.36 1891.7 4990.12 1863.5 5077.2C1838.03 5155.84 1866.56 5260.74 1951.48 5355.76" stroke="url(#paint1_linear_388_255)" stroke-width="175" stroke-linecap="round"/>

`

        ;
      const x0 = 120 + Math.random() * (window.innerWidth - 240);
      const y0 = 120 + Math.random() * (window.innerHeight - 240);

      el.style.cssText = `
            position:absolute;
            left : ${x0 - 50}px;
            top : ${y0 - 50}px;   
            border-radius:50%;
            z-index:-1;
            user-select:none;
            pointer-event:none;
        `;
      document.body.appendChild(el);
      cordH_m.set(el, {
        x: x0 + 50,
        y: y0 + 50,
      }); /*diamètre des coeurs de 100*/
      vecteursH_m.set(el, {
        vx: VX[Math.floor(Math.random() * VX.length)],
        vy: VY[Math.floor(Math.random() * VY.length)],
      });
      checkH_m.set(el, false);
      moveH(el);
    }
  })
